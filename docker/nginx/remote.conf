# Remote micro frontend: shell başqa origin-dən ES module kimi yüklədiyi üçün CORS başlıqları lazımdır.
# Production-da "*" əvəzinə shell-in konkret origin-ini yazmaq tövsiyə olunur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    location = /remoteEntry.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Standalone rejim üçün SPA fallback
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
