name: exam-frontend

# Lokal production-a bənzər yoxlama üçün. Backend (D:\exam-management-service) ayrıca işləməlidir
# və konteynerdən əlçatan olmalıdır (məs. --urls http://0.0.0.0:5099).
#   npm install                 # ilk dəfə: package-lock.json yaradır (Dockerfile npm ci istifadə edir)
#   docker compose up -d --build
#   http://localhost:8080
#
# Korporativ registry mirror-u üçün: NODE_IMAGE və NGINX_IMAGE dəyişənlərini .env faylında təyin edin.

x-image-args: &image-args
  NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
  NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
  # production (default) | staging — bax: .env.staging.example, .env.production.example
  BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-production}

services:
  shell:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: shell
      args:
        <<: *image-args
        APP: shell
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:5099}
      MFE_LESSONS_URL: ${MFE_LESSONS_URL:-http://localhost:8081}
      MFE_STUDENTS_URL: ${MFE_STUDENTS_URL:-http://localhost:8082}
      MFE_EXAMS_URL: ${MFE_EXAMS_URL:-http://localhost:8083}
      MFE_TESTS_URL: ${MFE_TESTS_URL:-http://localhost:8084}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SHELL_PORT:-8080}:80"
    depends_on: [mfe-lessons, mfe-students, mfe-exams, mfe-tests]

  mfe-lessons:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: remote
      args:
        <<: *image-args
        APP: mfe-lessons
    ports:
      - "${MFE_LESSONS_PORT:-8081}:80"

  mfe-students:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: remote
      args:
        <<: *image-args
        APP: mfe-students
    ports:
      - "${MFE_STUDENTS_PORT:-8082}:80"

  mfe-exams:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: remote
      args:
        <<: *image-args
        APP: mfe-exams
    ports:
      - "${MFE_EXAMS_PORT:-8083}:80"

  mfe-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: remote
      args:
        <<: *image-args
        APP: mfe-tests
    ports:
      - "${MFE_TESTS_PORT:-8084}:80"
